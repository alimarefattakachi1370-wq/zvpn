name: Build APKs
on: [workflow_dispatch, push]
jobs:
  build-user:
    name: User app (ZVPN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build (arm64 only, small APK)
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a
      - uses: actions/upload-artifact@v5
        with:
          name: zvpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk

  build-admin:
    name: Admin app (ZVPN Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build
        working-directory: ZvpnAdmin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: zvpn-admin-apk
          path: ZvpnAdmin/app/build/outputs/apk/debug/*.apk
